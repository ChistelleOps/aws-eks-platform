# AWS EKS Platform - Monitoring Configuration

grafana:
  enabled: true

  service:
    type: ClusterIP

  persistence:
    enabled: false
    sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL

  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: default
          orgId: 1
          folder: Applications
          type: file
          disableDeletion: false
          editable: false
          options:
            path: /var/lib/grafana/dashboards/default

  resources:
    requests:
      cpu: 50m
      memory: 2568Mi
    limits:
      cpu: 250m
      memory: 512Mi

prometheus:
  enabled: true

  prometheusSpec:
    retention: 24h

    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi

alertmanager:
  enabled: true

  alertmanagerSpec:
    replicas: 1

    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

kubeStateMetrics:
  enabled: true

prometheus-node-exporter:
  enabled: true