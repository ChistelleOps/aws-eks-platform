apiVersion: v1
data:
  fastapi.json: "\n{\n    \"uid\": \"fastapi-platform\",\n    \"title\": \"FastAPI
    - Application Monitoring\",\n    \"tags\": [\"fastapi\", \"sre\", \"platform\"],\n
    \   \"timezone\": \"browser\",\n    \"schemaVersion\": 39,\n    \"version\": 1,\n
    \   \"refresh\": \"30s\",\n    \"panels\": [\n      {\n        \"id\": 1,\n        \"title\":
    \"Requests per Second\",\n        \"type\": \"timeseries\",\n        \"datasource\":
    {\n          \"type\": \"prometheus\",\n          \"uid\": \"prometheus\"\n        },\n
    \       \"targets\": [\n          {\n            \"expr\": \"sum(rate(http_requests_total{job=\\\"platform-api\\\"}[5m]))\",\n
    \           \"legendFormat\": \"Requests/sec\",\n            \"refId\": \"A\"\n
    \         }\n        ],\n        \"gridPos\": {\n          \"h\": 8,\n          \"w\":
    12,\n          \"x\": 0,\n          \"y\": 0\n        }\n      },\n      {\n        \"id\":
    2,\n        \"title\": \"HTTP 5xx Error Rate\",\n        \"type\": \"timeseries\",\n
    \       \"datasource\": {\n          \"type\": \"prometheus\",\n          \"uid\":
    \"prometheus\"\n        },\n        \"targets\": [\n          {\n            \"expr\":
    \"sum(rate(http_requests_total{job=\\\"platform-api\\\",status=~\\\"5..\\\"}[5m]))\",\n
    \           \"legendFormat\": \"5xx errors/sec\",\n            \"refId\": \"A\"\n
    \         }\n        ],\n        \"gridPos\": {\n          \"h\": 8,\n          \"w\":
    12,\n          \"x\": 12,\n          \"y\": 0\n        }\n      },\n      {\n
    \       \"id\": 3,\n        \"title\": \"Average Response Latency\",\n        \"type\":
    \"timeseries\",\n        \"datasource\": {\n          \"type\": \"prometheus\",\n
    \         \"uid\": \"prometheus\"\n        },\n        \"targets\": [\n          {\n
    \           \"expr\": \"sum(rate(http_request_duration_seconds_sum{job=\\\"platform-api\\\"}[5m]))
    / sum(rate(http_request_duration_seconds_count{job=\\\"platform-api\\\"}[5m]))\",\n
    \           \"legendFormat\": \"Average latency\",\n            \"refId\": \"A\"\n
    \         }\n        ],\n        \"gridPos\": {\n          \"h\": 8,\n          \"w\":
    24,\n          \"x\": 0,\n          \"y\": 8\n        }\n      }\n    ]\n  }\n
    \ "
kind: ConfigMap
metadata:
  name: fastapi-grafana-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
