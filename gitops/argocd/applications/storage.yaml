apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: storage
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/ChistelleOps/aws-eks-platform.git
    targetRevision: main
    path: kubernetes/storage
    directory:
      include: storageclass.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true