apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-api
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/ChistelleOps/aws-eks-platform.git
    targetRevision: main
    path: helm/platform-api
    helm:
      releaseName: platform-api

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true