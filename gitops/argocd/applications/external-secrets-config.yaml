
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets-config
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/ChistelleOps/aws-eks-platform.git
    targetRevision: main
    path: gitops/secrets
    directory:
      recurse: false

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
