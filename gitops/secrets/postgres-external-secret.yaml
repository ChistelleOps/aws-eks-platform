
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: postgres-credentials
  namespace: default

spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore

  target:
    name: postgres-credentials
    creationPolicy: Owner

  data:
    - secretKey: password
      remoteRef:
        key: platform/dev/postgres
        property: password
