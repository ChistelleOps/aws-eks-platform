
name: Publish Docker Images to ECR

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "apps/platform-api/**"
      - ".github/workflows/ecr-publish.yml"

permissions:
  id-token: write
  contents: write

jobs:
  publish:
    name: Build and Push Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/platform-api/requirements-test.txt

      - name: Install FastAPI test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/platform-api/requirements-test.txt

      - name: Run FastAPI tests
        working-directory: apps/platform-api
        run: python -m pytest -v

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/aws-eks-platform-github-actions
          aws-region: us-east-1

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push images
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t "$ECR_REGISTRY/aws-eks-platform/platform-api:$IMAGE_TAG" \
            ./apps/platform-api

          docker build \
            -t "$ECR_REGISTRY/aws-eks-platform/portfolio:$IMAGE_TAG" \
            ./apps/portfolio

          docker push \
            "$ECR_REGISTRY/aws-eks-platform/platform-api:$IMAGE_TAG"

          docker push \
            "$ECR_REGISTRY/aws-eks-platform/portfolio:$IMAGE_TAG"

      - name: Update FastAPI Helm image tag
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          path = Path("helm/platform-api/values.yaml")
          lines = path.read_text().splitlines(keepends=True)

          in_image = False
          updated = 0

          for i, line in enumerate(lines):
              if line == "image:\n" or line == "image:":
                  in_image = True
                  continue

              if in_image and line and not line[0].isspace():
                  in_image = False

              if in_image and line.lstrip().startswith("tag:"):
                  lines[i] = f'  tag: "{os.environ["IMAGE_TAG"]}"\n'
                  updated += 1

          if updated != 1:
              raise SystemExit(f"Expected one image.tag, found {updated}")

          path.write_text("".join(lines))
          PY
      - name: Commit and push FastAPI image tag
        if: github.ref == 'refs/heads/main'
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add helm/platform-api/values.yaml

          if git diff --cached --quiet; then
            echo "Helm image tag is already up to date."
            exit 0
          fi

          git commit -m "ci: deploy platform-api ${IMAGE_TAG}"
          git push origin HEAD:main

