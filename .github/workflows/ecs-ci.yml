
name: ECS POC CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build FastAPI image
        run: docker build -t platform-api:ci ./apps/platform-api

      - name: Build Portfolio image
        run: docker build -t portfolio:ci ./apps/portfolio

  terraform-validate:
    name: Validate ECS Terraform
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: env/ecs-poc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform
        run: terraform init -backend=false

      - name: Validate Terraform
        run: terraform validate
